<title>Ghost Kitchen Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one-screen viewer. Thin tab strip on top, sketch canvas fills the rest. */
  :root {
    --bg: #f3efe6;        /* tea-towel linen */
    --fg: #1d1b2e;
    --muted: #6d6878;
    --line: #d8d1c2;
    --accent: #2b2f9e;    /* tower-module indigo */
    --tab-on: #1d1b2e;
    --tab-on-fg: #f3efe6;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161f; --fg: #ece8de; --muted: #9a95a6; --line: #34313f;
      --accent: #8f95ff; --tab-on: #ece8de; --tab-on-fg: #17161f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17161f; --fg: #ece8de; --muted: #9a95a6; --line: #34313f;
    --accent: #8f95ff; --tab-on: #ece8de; --tab-on-fg: #17161f; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column;
    font-family: var(--mono); font-size: 13px;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  h1 {
    font-family: var(--display); font-weight: 600; font-size: 20px;
    margin: 0; letter-spacing: -0.01em; text-wrap: balance;
  }
  h1 span { color: var(--accent); }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav button {
    font: inherit; color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 5px 10px; cursor: pointer;
  }
  nav button:hover { border-color: var(--fg); }
  nav button[aria-selected="true"] { background: var(--tab-on); color: var(--tab-on-fg); border-color: var(--tab-on); }
  nav button:focus-visible, .reroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .meta { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .reroll {
    font: inherit; color: var(--accent); background: none; border: 0; padding: 0;
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  .stage { flex: 1; min-height: 0; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  @media (max-width: 560px) { .meta { margin-left: 0; width: 100%; } }
</style>

<header>
  <h1>Ghost <span>Kitchen</span></h1>
  <nav role="tablist" id="tabs"></nav>
  <div class="meta">
    <span id="file"></span>
    <button class="reroll" id="reroll" type="button">Redraw</button>
  </div>
</header>
<div class="stage"><iframe id="frame" title="Sketch"></iframe></div>

<script>
  const sketches = [
    { id: 'tower', label: 'Tower module', file: 'tower-module.html' },
    { id: 'sketch', label: 'Print grid', file: /localhost|127\.0\.0\.1|github\.io/.test(location.hostname) ? 'index.html' : 'print-grid.html' },
    { id: 'shapes', label: 'Oven shapes', file: 'oven-shapes.html' },
    { id: 'panel', label: 'Panel module', file: 'panel-module.html' },
  ];
  const tabs = document.getElementById('tabs');
  const frame = document.getElementById('frame');
  const fileLabel = document.getElementById('file');

  function show(id) {
    const s = sketches.find(x => x.id === id) || sketches[0];
    for (const b of tabs.children) b.setAttribute('aria-selected', b.dataset.id === s.id);
    frame.src = s.file;
    fileLabel.textContent = s.id === 'sketch' ? 'sketch.js' : s.file.replace('.html', '.js');
    history.replaceState(null, '', '#' + s.id);
    try { localStorage.setItem('gk-tab', s.id); } catch (e) {}
  }

  for (const s of sketches) {
    const b = document.createElement('button');
    b.type = 'button'; b.role = 'tab'; b.dataset.id = s.id; b.textContent = s.label;
    b.addEventListener('click', () => show(s.id));
    tabs.appendChild(b);
  }
  document.getElementById('reroll').addEventListener('click', () => {
    frame.contentWindow.location.reload();
  });

  let start = location.hash.slice(1);
  if (!start) { try { start = localStorage.getItem('gk-tab'); } catch (e) {} }
  show(start || 'tower');
</script>
